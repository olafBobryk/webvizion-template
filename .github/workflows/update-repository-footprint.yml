name: Update repository footprint

on:
  push:
    branches: [main]
    paths-ignore:
      - src/app/(site)/(marketing)/repository-footprint/_data/repository-footprint.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: node scripts/generate-repository-footprint.mjs

      - name: Commit updated footprint
        run: |
          git diff --quiet -- src/app/'(site)'/'(marketing)'/repository-footprint/_data/repository-footprint.json || (
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/'(site)'/'(marketing)'/repository-footprint/_data/repository-footprint.json
            git commit -m "chore: update repository footprint"
            git push
          )
