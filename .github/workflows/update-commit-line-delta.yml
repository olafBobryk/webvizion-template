name: Update commit line delta chart

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/assets/commit-line-delta.svg
      - src/app/(site)/(dev)/internal/playground/commit-history/_data/commit-history.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/generate-commit-line-delta.mjs

      - name: Commit updated chart
        run: |
          git diff --quiet -- docs/assets/commit-line-delta.svg src/app/'(site)'/'(dev)'/internal/playground/commit-history/_data/commit-history.json || (
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/assets/commit-line-delta.svg
            git add src/app/'(site)'/'(dev)'/internal/playground/commit-history/_data/commit-history.json
            git commit -m "chore: update commit history charts"
            git push
          )
